<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dfff00"><meta name="description" content="Poem Studio 设计工作室，专注品牌视觉、网页和 App 设计。"><title>开始项目 · Poem Studio</title><link rel="icon" href="assets/mark.svg"><link rel="preload" as="font" href="assets/display.ttf" type="font/ttf" crossorigin><link rel="stylesheet" href="poem.css?v=3"><script src="poem.js?v=5" defer></script></head><body data-page="contact"><a class="skip" href="#content">跳到正文</a><div class="paper"><header class="site-header"></header><main id="content"><h1 class="page-title">聊聊你的<br><em>下一个想法。</em></h1><div class="contact-layout"><div><h2>聊聊你的想法。</h2><p>一个新品牌，一次网站改版，或是一款正在成形的 App。先写下你最想解决的问题。</p><p class="help">工作室联系渠道整理中。你可以先填写并下载项目简报，方便后续沟通。</p></div><form class="brief"><label>怎么称呼你<input name="name" autocomplete="name" required maxlength="80"></label><label>联系方式<input name="contact" placeholder="邮箱或微信" required maxlength="160"></label><label>项目类型<select name="service"><option value="brand">品牌设计</option><option value="web">网页设计</option><option value="app">App 设计</option><option value="health">医疗健康 / 药业设计</option><option value="other">综合项目 / 尚未确定</option></select></label><label>简单介绍你的项目<textarea name="description" required maxlength="4000" placeholder="项目背景、期望解决的问题、时间安排……"></textarea></label><button class="button" type="submit">下载项目简报</button><p class="help">填写内容仅在当前浏览器内生成文档。</p><p class="form-status" role="status"></p></form></div></main><footer class="site-footer"></footer></div></body></html>
